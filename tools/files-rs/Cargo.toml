[package]
name = "t2r-files"
version = "0.1.0"
edition = "2021"
description = "Twelve Weeks update server front: serves the big blobs with sendfile, passes every other request to the Python update server"

[[bin]]
name = "t2r-files"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
